<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Territorios</title>
<style>
:root{--bg:#f1f5f9;--cd:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--pr:#2563eb;--ok:#22c55e;--hd:#312e81}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0b1120;--cd:#1e293b;--tx:#f1f5f9;--mu:#94a3b8;--bd:#334155;--pr:#3b82f6;--hd:#1e1b4b}}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:var(--bg);color:var(--tx);padding:12px;display:flex;justify-content:center}
#app{width:100%;max-width:480px;background:var(--cd);border:1px solid var(--bd);border-radius:16px;overflow:hidden;min-height:300px}
.hd{background:var(--hd);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}.hd h1{font-size:17px}.hd small{font-size:12px;color:#c7d2fe}.hd button{background:none;border:0;color:#c7d2fe;font-size:12px;text-decoration:underline}
.tabs{display:flex;gap:4px;padding:4px;border-bottom:1px solid var(--bd)}
.tabs button{flex:1;padding:10px 4px;border:0;border-radius:8px;background:none;color:var(--mu);font-weight:600;font-size:12px}.tabs .on{background:var(--bg);color:var(--pr)}
.ct{padding:16px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--pr);color:#fff;font-weight:600;font-size:13px;margin-bottom:10px}
.g{background:var(--bg);color:var(--tx)}.rd{background:#ef4444}.sm{padding:8px;font-size:12px;margin:0}
.cd{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:8px}.t{font-weight:700}.mu{font-size:12px;color:var(--mu)}
.bg{font-size:10px;font-weight:700;padding:4px 8px;border-radius:20px;background:#dcfce7;color:#15803d;height:fit-content;white-space:nowrap}.bg.as{background:#dbeafe;color:#1d4ed8}
.im{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin:8px 0;display:block;background:var(--bg)}
.ph{height:80px;border-radius:8px;margin:8px 0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mu)}
.row{display:flex;gap:8px;margin-top:12px}.row .btn{margin:0}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;overflow:auto}
.md{background:var(--cd);border-radius:16px;width:100%;max-width:420px;padding:18px;max-height:100%;overflow:auto}.md h3{margin-bottom:12px;font-size:16px}
label{display:block;font-size:11px;font-weight:600;color:var(--mu);margin-bottom:10px}
input,select{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:14px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:8px}
.gr button{height:40px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--tx);font-weight:700}.gr .dn{background:var(--ok);color:#fff}
.er{color:#ef4444;font-size:12px;margin:6px 0}.chips span{display:inline-block;font-size:11px;background:var(--bg);padding:4px 8px;border-radius:12px;margin:0 6px 6px 0}
.nt{background:#dbeafe;color:#1e3a8a;padding:12px 16px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}.nt button{border:0;background:none;font-weight:700;color:inherit}
.em{text-align:center;color:var(--mu);padding:30px 10px;font-size:13px}.c{text-align:center}.c h2{margin:8px 0}
</style></head><body><div id="app"><p class="em">Cargando…</p></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,addDoc,collection,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// ====== PEGA AQUÍ LA CONFIGURACIÓN DE TU PROYECTO FIREBASE ======
const CONFIG={apiKey:"AIzaSyCYWpD9nDCWklJS7WjK3IyO8M5cKlrm1S0",authDomain:"territory-42daa.firebaseapp.com",projectId:"territory-42daa",appId:"1:939260692253:web:58436bbfcab74b4f0c43f4"};
// ================================================================

const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const field=(l,t,v)=>{const w=el('label','',l),i=el('input');i.type=t;if(v!=null)i.value=v;w.append(i);w.i=i;return w};
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const rnd=()=>[...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(36)).join('').slice(0,12);
const P=new URLSearchParams(location.search),invC=P.get('c'),invK=P.get('k');

if(!CONFIG.apiKey){$('#app').innerHTML='<p class="em">Falta pegar la configuración de Firebase en el archivo (busca CONFIG).</p>'}
const app=CONFIG.apiKey?initializeApp(CONFIG):null,auth=app&&getAuth(app),db=app&&getFirestore(app);
let S={u:null,ready:false,prof:null,step:'',mode:'new',cong:null,mems:[],terr:[],cyc:[],logs:[],sch:[],notice:'',tab:'t',openId:null,err:''},ls=false;
const isSup=()=>S.prof&&S.prof.role==='super';
const cid=()=>S.prof.cid;
const dref=(...p)=>doc(db,'congregations',cid(),...p);
const cref=n=>collection(db,'congregations',cid(),n);
const capName=id=>(S.mems.find(m=>m.id===id)||{}).name;
const vis=()=>isSup()?S.terr:S.terr.filter(t=>t.captainId===S.u.uid);

if(auth)onAuthStateChanged(auth,async u=>{
  S.u=u;S.ready=true;S.prof=null;
  if(u){try{const p=await getDoc(doc(db,'users',u.uid));S.prof=p.exists()?p.data():null;if(S.prof)listen()}catch(e){S.err=e.message}}
  render();
});

function listen(){
  if(ls)return;ls=true;
  const e=x=>{S.err=x.message;render()};
  onSnapshot(dref(),s=>{S.cong=s.data();render()},e);
  const sub=(n,k)=>onSnapshot(cref(n),s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));render()},e);
  sub('members','mems');sub('territories','terr');sub('cycles','cyc');sub('logs','logs');
  onSnapshot(cref('schedules'),s=>{S.sch=s.docs.map(d=>({id:d.id,...d.data()}));render();checkDue()},e);setInterval(checkDue,30000);
}

function modal(title,body,acts){
  const o=el('div','ov'),m=el('div','md'),r=el('div','row');m.append(el('h3','',title),body);
  acts.forEach(([l,f,c])=>{const b=el('button','btn '+(c||''),l);b.onclick=async()=>{if(f&&(await f())===false)return;o.remove()};r.append(b)});
  m.append(r);o.append(m);document.body.append(o);
}

function render(){
  if(!app)return;const A=$('#app');A.textContent='';
  if(!S.ready)return A.append(el('p','em','Cargando…'));
  if(!S.u)return authView(A);
  if(!S.prof)return onboard(A);
  const hd=el('div','hd'),l=el('div');
  l.append(el('h1','','🗺️ '+(S.cong?S.cong.name:'Territorios')),el('small','',isSup()?'Superintendente':'Capitán: '+(capName(S.u.uid)||'')));
  const out=el('button','','Salir');out.onclick=()=>signOut(auth);hd.append(l,out);A.append(hd);
  if(S.err)A.append(el('p','er',S.err));
  if(S.notice){const n=el('div','nt'),x=el('button','','Entendido');n.append(el('span','',S.notice),x);x.onclick=()=>{S.notice='';render()};A.append(n)}
  const tabs=el('div','tabs');
  [['t','🗺️ Territorios'],['c','📜 Ciclos'],['d','📅 Por día']].forEach(([k,n])=>{const b=el('button',S.tab===k?'on':'',n);b.onclick=()=>{S.tab=k;render()};tabs.append(b)});
  const ct=el('div','ct');A.append(tabs,ct);
  if(S.tab==='t')viewT(ct);else if(S.tab==='c')viewC(ct);else viewD(ct);
  $('#mm')&&$('#mm').remove();if(S.openId)viewMap();
}

// ---------- Registro / entrada ----------
function authView(A){
  const c=el('div','ct c'),em=field('Correo','email'),pw=field('Contraseña (mínimo 6)','password'),er=el('p','er');
  c.append(el('div','','🗺️'),el('h2','','Territorios'),el('p','mu','Inicia sesión o regístrate'),el('br'));
  const g=el('button','btn','Continuar con Google');g.onclick=()=>go(()=>signInWithPopup(auth,new GoogleAuthProvider()));
  const a=el('button','btn g','Entrar'),b=el('button','btn g','Crear cuenta con correo');
  const go=async f=>{er.textContent='';try{await f()}catch(e){er.textContent='No se pudo: '+e.message}};
  a.onclick=()=>go(()=>signInWithEmailAndPassword(auth,em.i.value.trim(),pw.i.value));
  b.onclick=()=>go(()=>createUserWithEmailAndPassword(auth,em.i.value.trim(),pw.i.value));
  c.append(g,el('p','mu','o con correo:'),em,pw,er,a,b);A.append(c);
}

function onboard(A){
  const c=el('div','ct'),er=el('p','er');A.append(c);
  const done=async(role)=>{await setDoc(doc(db,'users',S.u.uid),{cid:S.cid,role});S.prof={cid:S.cid,role};listen();render()};
  const nm=S.u.displayName||S.u.email||'Sin nombre';
  if(invC&&invK&&!S.step)S.step='captain';
  if(!S.step){
    c.append(el('h3','','¿Cuál es tu función?'),el('br'));
    const s=el('button','btn','👔 Soy Superintendente'),k=el('button','btn g','📱 Soy Capitán');
    s.onclick=()=>{S.step='super';render()};k.onclick=()=>{S.step='captain';render()};
    c.append(s,k,el('p','mu','Los capitanes entran con el enlace que les mande su superintendente.'));return;
  }
  const back=el('button','btn g','← Atrás');back.onclick=()=>{S.step='';render()};
  if(S.step==='captain'){
    c.append(el('h3','','Registro de capitán'),el('br'));
    if(!invC||!invK){c.append(el('p','mu','Pide a tu superintendente el enlace de invitación y ábrelo de nuevo.'),el('br'),back);return}
    const n=field('Nombre completo','text',S.u.displayName||''),p=field('Teléfono','tel'),b=el('button','btn','Unirme');
    b.onclick=async()=>{const name=n.i.value.trim();if(!name){er.textContent='Escribe tu nombre.';return}
      try{S.cid=invC;await setDoc(doc(db,'congregations',invC,'members',S.u.uid),{role:'captain',name,phone:p.i.value.trim(),code:invK});await done('captain')}
      catch(e){er.textContent='Enlace no válido o vencido.'}};
    c.append(n,p,er,b,back);return;
  }
  c.append(el('h3','','Congregación'),el('br'));
  const mk=el('button','btn'+(S.mode==='new'?'':' g'),'Crear nueva'),jn=el('button','btn'+(S.mode==='join'?'':' g'),'Entrar a una existente');
  mk.onclick=()=>{S.mode='new';render()};jn.onclick=()=>{S.mode='join';render()};
  const n=field('Nombre de la congregación','text'),p=field('Contraseña','password'),b=el('button','btn',S.mode==='new'?'Crear congregación':'Entrar');
  b.onclick=async()=>{
    const name=n.i.value.trim(),id=slug(name);if(!id||p.i.value.length<4){er.textContent='Escribe el nombre y una contraseña de al menos 4 caracteres.';return}
    const pwHash=await sha(id+':'+p.i.value);S.cid=id;
    try{
      if(S.mode==='new'){
        const w=writeBatch(db);
        w.set(doc(db,'congregations',id),{name,pwHash,capCode:rnd(),createdBy:S.u.uid});
        w.set(doc(db,'congregations',id,'members',S.u.uid),{role:'super',name:nm,pw:pwHash});
        await w.commit();
      }else await setDoc(doc(db,'congregations',id,'members',S.u.uid),{role:'super',name:nm,pw:pwHash});
      await done('super');
    }catch(e){er.textContent=S.mode==='new'?'Ese nombre ya existe. Prueba con otro.':'Nombre o contraseña incorrectos.'}
  };
  const r=el('div','row');r.append(mk,jn);c.append(r,el('br'),n,p,er,b,back);
}

// ---------- Territorios ----------
function viewT(ct){
  if(isSup()){
    const a=el('button','btn','➕ Agregar territorio');a.onclick=()=>terrForm();ct.append(a);
    const pr=el('button','btn g','🗓️ Programar asignación');pr.onclick=progForm;ct.append(pr);
    if(S.sch.length){const q=el('div','cd');q.append(el('div','t','Asignaciones programadas'));
      S.sch.slice().sort((a,b)=>a.when.toMillis()-b.when.toMillis()).forEach(s=>{const r=el('div','row'),x=el('button','btn sm rd','✖'),tx=el('p','mu',s.tname+' → '+s.cname+' • '+s.when.toDate().toLocaleString('es-MX',{weekday:'long',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}));x.style.width='44px';tx.style.flex='1';x.onclick=()=>deleteDoc(dref('schedules',s.id));r.append(tx,x);q.append(r)});
      ct.append(q)}
    const link=location.origin+location.pathname+'?c='+cid()+'&k='+(S.cong?S.cong.capCode:''),s=el('div','cd');
    const i=el('input');i.readOnly=true;i.value=link;
    const cp=el('button','btn sm','🔗 Copiar enlace de invitación');cp.style.marginTop='8px';
    cp.onclick=async()=>{try{await navigator.clipboard.writeText(link);cp.textContent='✅ Copiado'}catch(e){i.select()}};
    const ch=el('div','chips');ch.style.marginTop='10px';
    const caps=S.mems.filter(m=>m.role==='captain');caps.forEach(m=>ch.append(el('span','','👤 '+m.name)));if(!caps.length)ch.append(el('span','','Aún ningún capitán'));
    s.append(el('div','t','Capitanes'),el('p','mu','Manda este enlace a tus capitanes:'),i,cp,ch);ct.append(s);
  }
  const list=vis().slice().sort((x,y)=>x.number-y.number);
  if(!list.length){ct.append(el('div','em',isSup()?'No hay territorios. Agrega el primero.':'Aún no tienes territorios asignados.'));return}
  list.forEach(t=>{
    const c=el('div','cd'),top=el('div','top'),l=el('div');
    l.append(el('div','t',t.colonia+' #'+t.number),el('div','mu',(t.captainId?'Capitán: '+(capName(t.captainId)||'—'):'Sin asignar')+' • '+t.total+' manzanas'));
    top.append(l,el('span','bg'+(t.captainId?' as':''),t.captainId?'Asignado':'Disponible'));c.append(top);
    if(t.img){const i=el('img','im');i.src=t.img;i.alt='Mapa';c.append(i)}else c.append(el('div','ph','Sin mapa'));
    c.append(el('p','mu','Avance: '+(t.done||[]).length+' / '+t.total+' manzanas'));
    const r=el('div','row'),v=el('button','btn sm','👁️ Ver mapa');v.onclick=()=>{S.openId=t.id;render()};r.append(v);
    if(isSup()){
      const as=el('button','btn sm g','👤'),ed=el('button','btn sm g','✏️'),dl=el('button','btn sm rd','🗑️');
      as.onclick=()=>assign(t);ed.onclick=()=>terrForm(t);
      dl.onclick=()=>modal('¿Eliminar territorio?',el('p','mu',t.colonia+' #'+t.number),[['Cancelar',null,'g'],['Eliminar',()=>deleteDoc(dref('territories',t.id)),'rd']]);
      r.append(as,ed,dl);
    }
    c.append(r);ct.append(c);
  });
}

const shrink=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)});

function terrForm(t){
  const c=el('div'),a=field('Colonia','text',t&&t.colonia),b=field('Número de territorio','number',t&&t.number),n=field('Cantidad de manzanas','number',t&&t.total),er=el('p','er');
  const f=el('input');f.type='file';f.accept='image/*';f.style.display='none';
  const fb=el('button','btn g',t&&t.img?'📷 Cambiar imagen del mapa':'📷 Elegir imagen del mapa');
  fb.onclick=()=>f.click();f.onchange=()=>{if(f.files[0])fb.textContent='✅ '+f.files[0].name};
  c.append(a,b,n,f,fb,er);
  modal(t?'Editar territorio':'Nuevo territorio',c,[['Cancelar',null,'g'],['Guardar',async()=>{
    const colonia=a.i.value.trim(),number=+b.i.value,total=Math.floor(+n.i.value);
    if(!colonia||!number||total<1){er.textContent='Completa colonia, número y manzanas.';return false}
    try{
      let img=(t&&t.img)||'';
      if(f.files[0]){img=await shrink(f.files[0]);if(img.length>900000){er.textContent='La imagen es demasiado pesada.';return false}}
      const d={colonia,number,total,img,done:((t&&t.done)||[]).filter(x=>x<=total),captainId:(t&&t.captainId)||'',start:(t&&t.start)||''};
      if(t)await setDoc(dref('territories',t.id),d);else await addDoc(cref('territories'),d);
    }catch(e){er.textContent='Error: '+e.message;return false}
  }]]);
}

function progForm(){
  const caps=S.mems.filter(m=>m.role==='captain'),c=el('div'),er=el('p','er');
  const w1=el('label','','Capitán'),s1=el('select'),w2=el('label','','Territorio'),s2=el('select');
  caps.forEach(m=>s1.append(new Option(m.name,m.id)));
  S.terr.slice().sort((a,b)=>a.number-b.number).forEach(t=>s2.append(new Option(t.colonia+' #'+t.number,t.id)));
  w1.append(s1);w2.append(s2);
  const d=field('Fecha y hora de la asignación','datetime-local');
  c.append(w1,w2,d,er);
  modal('Programar asignación',c,[['Cancelar',null,'g'],['Programar',async()=>{
    if(!s1.value||!s2.value||!d.i.value){er.textContent='Necesitas un capitán, un territorio y la fecha y hora.';return false}
    const when=new Date(d.i.value);if(when<=new Date()){er.textContent='Elige una fecha y hora futuras.';return false}
    const t=S.terr.find(x=>x.id===s2.value);
    try{await setDoc(dref('schedules',t.id),{captainId:s1.value,cname:capName(s1.value)||'',tid:t.id,tname:t.colonia+' #'+t.number,when})}
    catch(e){er.textContent='Error: '+e.message;return false}
  }]]);
}

const busy={};
async function checkDue(){
  if(!S.prof||isSup())return;
  for(const s of S.sch){
    if(s.captainId!==S.u.uid||busy[s.id]||s.when.toDate()>new Date())continue;
    busy[s.id]=1;
    try{await updateDoc(dref('territories',s.tid),{captainId:S.u.uid});await deleteDoc(dref('schedules',s.id));S.notice='📍 Se te asignó el territorio '+s.tname;render()}
    catch(e){delete busy[s.id]}
  }
}

function assign(t){
  const w=el('label','','Capitán'),s=el('select');
  s.append(new Option('— Sin asignar —',''));S.mems.filter(m=>m.role==='captain').forEach(m=>s.append(new Option(m.name,m.id)));s.value=t.captainId||'';w.append(s);
  modal('Asignar capitán',w,[['Cancelar',null,'g'],['Asignar',()=>updateDoc(dref('territories',t.id),{captainId:s.value})]]);
}

function viewMap(){
  const t=S.terr.find(x=>x.id===S.openId);if(!t){S.openId=null;return}
  const o=el('div','ov'),m=el('div','md'),can=isSup()||t.captainId===S.u.uid;o.id='mm';
  m.append(el('h3','',t.colonia+' #'+t.number));
  if(t.img){const i=el('img','im');i.src=t.img;i.alt='Mapa';m.append(i)}
  m.append(el('p','mu',can?'Toca una manzana para marcar o desmarcar:':'Solo el capitán asignado puede marcar manzanas.'));
  const g=el('div','gr');
  for(let i=1;i<=t.total;i++){const b=el('button',(t.done||[]).includes(i)?'dn':'',i);b.onclick=()=>toggle(t,i);g.append(b)}
  const r=el('div','row'),x=el('button','btn','Cerrar');x.onclick=()=>{S.openId=null;render()};r.append(x);
  m.append(g,r);o.append(m);document.body.append(o);
}

async function toggle(t,i){
  if(!(isSup()||t.captainId===S.u.uid))return;
  const done=t.done||[],has=done.includes(i),d=today(),name=t.colonia+' #'+t.number,lr=dref('logs',d+'_'+t.id),tr=dref('territories',t.id);
  const nd=has?done.filter(x=>x!==i):[...done,i].sort((a,b)=>a-b);
  try{
    const s=await getDoc(lr),lg=s.exists()?s.data():{date:d,tid:t.id,tname:name,blocks:[]};
    const bl=has?lg.blocks.filter(x=>x!==i):[...new Set([...lg.blocks,i])].sort((a,b)=>a-b);
    if(bl.length)await setDoc(lr,{...lg,blocks:bl});else if(s.exists())await deleteDoc(lr);
    const start=nd.length?(t.start||d):'';
    if(nd.length===t.total){await addDoc(cref('cycles'),{tid:t.id,tname:name,start,end:d});await updateDoc(tr,{done:[],start:''})}
    else await updateDoc(tr,{done:nd,start});
  }catch(e){S.err='Error al guardar: '+e.message;render()}
}

function viewC(ct){
  const ids=vis().map(t=>t.id),l=S.cyc.filter(c=>isSup()||ids.includes(c.tid)).sort((a,b)=>b.end.localeCompare(a.end));
  if(!l.length)return ct.append(el('div','em','Aún no hay ciclos completados.'));
  l.forEach(c=>{const d=el('div','cd');d.append(el('div','t',c.tname),el('p','mu','📅 Inicio: '+(c.start?fmt(c.start):'—')),el('p','mu','🏁 Término: '+fmt(c.end)));ct.append(d)});
}
function viewD(ct){
  const ids=vis().map(t=>t.id),l=S.logs.filter(g=>isSup()||ids.includes(g.tid)).sort((a,b)=>b.date.localeCompare(a.date));
  if(!l.length)return ct.append(el('div','em','Aún no hay manzanas trabajadas.'));
  l.forEach(g=>{const d=el('div','cd');d.append(el('div','mu',fmt(g.date)),el('div','t',g.tname),el('p','mu','📍 Manzanas: '+g.blocks.join(', ')));ct.append(d)});
}
</script></body></html>
